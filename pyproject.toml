[project]
name = "timecopilot-kumo-forecast"
version = "0.1.0"
description = "Inference-only packaging of NVIDIA Kumo-Forecast (MOMENT-based forecaster) for FoundationForecast"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "huggingface-hub>=0.22.0",
  "joblib>=1.3.0",
  "numpy>=1.24.0",
  "torch>=2.7.0",
  "transformers>=4.36.0",
]

[project.urls]
Homepage = "https://github.com/TimeCopilot/timecopilot-kumo-forecast"
Upstream = "https://github.com/NVIDIA/Kumo-TS"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kumo_forecast"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.12"]

[tool.ruff]
line-length = 88
extend-exclude = ["kumo_forecast/_backbone.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
